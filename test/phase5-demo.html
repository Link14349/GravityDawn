<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phase 5 Demo — 建筑与目标系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; margin: 0 auto; cursor: crosshair; }
    #hud {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      color: #ddd; font-family: monospace; font-size: 12px; pointer-events: none;
      text-align: center; line-height: 1.5;
      background: rgba(0,0,0,0.55); padding: 4px 16px; border-radius: 6px;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud"></div>
  <script type="module">
    import { PhysicsEngine } from '../src/physics.js';
    import { Renderer } from '../src/renderer.js';
    import { CelestialBody } from '../src/celestial.js';
    import { Bullet } from '../src/bullet.js';
    import { GameController, GameState } from '../src/game-controller.js';
    import { Camera } from '../src/camera.js';
    import { Building } from '../src/building.js';

    const canvas = document.getElementById('c');
    canvas.width = 1200; canvas.height = 800;
    const G_PHYS = 300;
    const BULLET_R = 6;

    // =====================
    // 星体
    // =====================
    const star = new CelestialBody({
      mass: 8000, orbit: CelestialBody.fixedPosition(600, 400),
      radius: 50, collisionRadius: 45, color: '#ffbb33', label: '恒星',
    });
    // 目标行星（固定，建筑在它上面）
    const targetPlanet = new CelestialBody({
      mass: 1500, orbit: CelestialBody.fixedPosition(850, 400),
      radius: 55, collisionRadius: 50, color: '#66aaff', label: '目标行星',
    });
    const allBodies = [star, targetPlanet];

    // =====================
    // 建筑（在目标行星表面）
    // =====================
    const tp = targetPlanet.getPosition();
    const building = new Building();

    // 底部锚点（固定在行星表面）
    const anchors = [];
    const anchorY = tp.y - targetPlanet.radius - 5;
    for (let i = 0; i < 3; i++) {
      const ax = tp.x - 30 + i * 30;
      const a = building.addPoint({ x: ax, y: anchorY, mass: 100, radius: 6, score: 0, fixed: true, color: '#4488aa' });
      anchors.push(a);
    }

    // 塔身质点（2 层，每层 3 个）
    const towerPoints = [];
    for (let row = 0; row < 2; row++) {
      const rowY = anchorY - 30 - row * 35;
      for (let col = 0; col < 3; col++) {
        const px = tp.x - 30 + col * 30;
        const p = building.addPoint({ x: px, y: rowY, mass: 8, radius: 5, score: 20, important: row === 0, color: '#cccccc' });
        towerPoints.push(p);
      }
    }

    // 屋顶质点（重要目标）
    const roof = building.addPoint({ x: tp.x, y: anchorY - 100, mass: 5, radius: 7, score: 100, important: true, color: '#ff6644' });

    // 弹簧：锚点 → 第一层
    for (let i = 0; i < 3; i++) {
      building.addSpring({ a: anchors[i], b: towerPoints[i], stiffness: 300, breakTension: 400 });
    }
    // 弹簧：第一层 → 第二层
    for (let i = 0; i < 3; i++) {
      building.addSpring({ a: towerPoints[i], b: towerPoints[i + 3], stiffness: 300, breakTension: 400 });
    }
    // 弹簧：第二层 → 屋顶
    building.addSpring({ a: towerPoints[4], b: roof, stiffness: 300, breakTension: 300 });
    building.addSpring({ a: towerPoints[3], b: roof, stiffness: 200, breakTension: 250 });
    building.addSpring({ a: towerPoints[5], b: roof, stiffness: 200, breakTension: 250 });

    // 水平弹簧
    for (let row = 0; row < 2; row++) {
      for (let col = 0; col < 2; col++) {
        const idx = row * 3 + col;
        building.addSpring({ a: towerPoints[idx], b: towerPoints[idx + 1], stiffness: 150, breakTension: 250 });
      }
    }

    // =====================
    // 物理引擎
    // =====================
    const phys = new PhysicsEngine({ G: G_PHYS });
    let physicsTime = 0;
    for (const b of allBodies) {
      const p = b.getPosition();
      phys.addGravitySource(p.x, p.y, b.mass, b.collisionRadius, b.orbitFn);
    }

    // =====================
    // 子弹 — 绕恒星轨道
    // =====================
    const bullets = [
      new Bullet({ payloadMass: 5, fuelMass: 30, ve: 300, ignitionCount: 2, explosionRadius: 60, explosionImpulse: 3000 }),
      new Bullet({ payloadMass: 8, fuelMass: 20, ve: 250, ignitionCount: 3, explosionRadius: 40, explosionImpulse: 2000 }),
    ];
    for (let i = 0; i < bullets.length; i++) {
      bullets[i].bindOrbit(star, 80 + i * 30, star.radius, i * Math.PI, G_PHYS);
    }

    // =====================
    // 控制器 + 镜头
    // =====================
    const ctrl = new GameController(canvas, { physics: phys, bullets, camera: null, getTime: () => physicsTime, buildings: [building] });
    const camera = new Camera(canvas, { shouldBlockPan: () => ctrl.getHoveredBullet() !== null });
    ctrl.camera = camera;
    camera.x = 700; camera.y = 400; camera.zoom = 0.9;

    const r = new Renderer(canvas);
    const ctx = r.ctx;
    const explosions = [];
    for (const b of bullets) b._trail = [];

    // =====================
    // HUD
    // =====================
    function hud() {
      const h = document.getElementById('hud');
      const hb = ctrl.getHoveredBullet();
      const aliveB = bullets.filter(b => b.alive).length;
      const info = hb ? ` | 悬停: 点火${hb.remainingIgnitions}/${hb.ignitionCount} ΔV${hb.remainingDeltaV.toFixed(0)}m/s` : '';
      const buildingStatus = `建筑: 质点${building.alivePointCount}/${building.points.length} 弹簧${building.aliveSpringCount}/${building.springs.length}`;
      h.innerHTML = `存活子弹:${aliveB}/${bullets.length}${info} | ${buildingStatus}`;
    }

    // =====================
    // 主循环
    // =====================
    function loop() {
      hud();

      // 星体位置
      for (let i = 0; i < allBodies.length; i++) {
        const b = allBodies[i];
        if (!ctrl.shouldPause()) b.update(1 / 60);
        phys.updateSourcePosition(i, b.getPosition().x, b.getPosition().y);
      }

      // 物理步进
      if (!ctrl.shouldPause()) {
        physicsTime += 1 / 60;
        // 建筑弹簧质点模拟
        building.step(1 / 60);
        // 子弹
        for (const b of bullets) {
          if (!b.alive) continue;
          if (!b.launched) {
            b.updateOrbitPosition(1 / 60);
          } else {
            const col = phys.stepParticle(b, undefined, BULLET_R);
            b._trail.push({ x: b.x, y: b.y, life: 1.0 });
            if (b._trail.length > 300) b._trail.shift();

            // 碰撞检测：星体
            if (col) {
              explosions.push({ x: b.x, y: b.y, r: 0, maxR: b.getEffectiveExplosionRadius() || 50 });
              b.alive = false;
            }
            // 碰撞检测：建筑质点 + 弹簧
            const hitPoint = building.checkBulletCollision(b.x, b.y, BULLET_R);
            const hitSpring = hitPoint ? null : building.checkSpringCollision(b.x, b.y, BULLET_R);
            if (hitPoint || hitSpring) {
              if (hitSpring) {
                // 弹簧命中：切断弹簧 + 冲量传递给两端质点
                building.cutSpringAndTransferImpulse(hitSpring, b.getEffectiveExplosionImpulse());
              }
              const effR = b.getEffectiveExplosionRadius();
              const effP = b.getEffectiveExplosionImpulse();
              building.applyExplosion(b.x, b.y, effR, effP);
              explosions.push({ x: b.x, y: b.y, r: 0, maxR: effR || 50 });
              b.alive = false;
            }
          }
        }
      }

      // 爆炸动画
      for (const ex of explosions) ex.r += 4;

      // =====================
      // 渲染
      // =====================
      r.clear();
      camera.applyTransform(ctx);

      // 星体
      for (const b of allBodies) r.drawCelestialBody(b);

      // 建筑（委托给 Renderer）
      r.drawBuilding(building);

      // 轨迹
      for (const b of bullets) r.drawFadingTrail(b._trail);

      // 瞄准叠加层
      r.drawAimOverlay(ctrl, allBodies);

      // 子弹
      const hoveredBullet = ctrl.getHoveredBullet();
      for (const b of bullets) {
        if (!b.alive || !isFinite(b.x)) continue;
        r.drawBullet(b.x, b.y, b.vx, b.vy, BULLET_R, b.launched, b === hoveredBullet);
      }

      // 爆炸
      for (let i = explosions.length - 1; i >= 0; i--) {
        const ex = explosions[i];
        const alpha = 1 - ex.r / ex.maxR;
        if (alpha <= 0) { explosions.splice(i, 1); continue; }
        ctx.strokeStyle = `rgba(255, 180, 60, ${alpha})`;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI * 2); ctx.stroke();
      }

      camera.restoreTransform(ctx);
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.font = '11px monospace'; ctx.textAlign = 'left';
      ctx.fillText(`缩放:${camera.zoom.toFixed(1)}x | 滚轮缩放 | 空白处拖拽平移`, 10, 790);

      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
