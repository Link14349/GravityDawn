<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阶段四 — ΔV 上限与取消规划</title>
  <style>
    body { margin: 0; padding: 20px; background: #f4f3ed; color: #252b2a; font: 14px/1.7 system-ui, sans-serif; }
    main { max-width: 1000px; margin: auto; }
    h1 { font-size: 24px; font-weight: 500; margin: 0; }
    canvas { display: block; width: 100%; height: auto; border: 1px solid #d8dad2; }
    button, a { color: inherit; margin-right: 16px; }
    #status { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body><main>
  <h1>ΔV 上限与取消规划</h1>
  <p>悬停红色弹体查看点线圈。圈内反向拖拽并松手点火；拖出圈外立即取消，不消耗燃料或点火。滚轮缩放，空格暂停。</p>
  <p><button id="reset">重置弹体</button><a href="/">进入完整游戏 →</a></p>
  <canvas id="c" width="1000" height="600" aria-label="ΔV 取消规划演示，拖出点线圈取消"></canvas>
  <p id="status" role="status"></p>
</main>
<script type="module">
import { PhysicsEngine } from '../src/physics.js';
import { Bullet } from '../src/bullet.js';
import { GameController } from '../src/game-controller.js';
import { Camera } from '../src/camera.js';
import { Renderer } from '../src/renderer.js';
import { FlightSimulation } from '../src/flight-simulation.js';

const canvas = document.getElementById('c'), renderer = new Renderer(canvas);
let bullet, simulation, ctrl;
const camera = new Camera(canvas, { shouldBlockPan: () => !!ctrl?.getHoveredBullet() });
function reset() {
  ctrl?.destroy();
  bullet = new Bullet({ x: 0, y: 0, deltaV: 120, ignitionCount: 3 });
  const physics = new PhysicsEngine({ G: 0 });
  simulation = new FlightSimulation({ physics, bullets: [bullet], allBodies: [], buildings: [] });
  ctrl = new GameController(canvas, { physics, bullets: [bullet], camera, getTime: () => simulation.physicsTime });
  camera.x = 0; camera.y = 0; camera.zoom = 1; camera._panning = false;
}
document.getElementById('reset').addEventListener('click', reset);
reset();
let previous = performance.now(), accumulator = 0;
function frame(now) {
  accumulator += Math.min((now - previous) / 1000, 0.1); previous = now;
  while (accumulator >= 1 / 60) { if (!ctrl.shouldPause()) simulation.step(ctrl); accumulator -= 1 / 60; }
  renderer.clear(); camera.applyTransform(renderer.ctx);
  renderer.drawFadingTrail(bullet._trail);
  renderer.drawAimOverlay(ctrl);
  renderer.drawBullet(bullet.x, bullet.y, bullet.vx, bullet.vy, bullet.renderRadius, bullet.launched, bullet === ctrl.getHoveredBullet(), bullet.color);
  camera.restoreTransform(renderer.ctx);
  document.getElementById('status').textContent = `${ctrl.shouldPause() ? '规划 / 暂停' : '运行中'} · ${bullet.launched ? '已发射' : '待发射'} · 剩余 ΔV ${bullet.remainingDeltaV.toFixed(1)} · 点火 ${bullet.remainingIgnitions} · 燃料 ${bullet.fuelMass.toFixed(3)} · 缩放 ${camera.zoom.toFixed(1)}×`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
