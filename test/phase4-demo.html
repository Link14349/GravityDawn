<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phase 4 Demo — 子弹系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; margin: 0 auto; cursor: crosshair; }
    #hud {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      color: #ddd; font-family: monospace; font-size: 12px; pointer-events: none;
      text-align: center; line-height: 1.5;
      background: rgba(0,0,0,0.55); padding: 4px 16px; border-radius: 6px;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud"></div>
  <script type="module">
    import { PhysicsEngine } from '../src/physics.js';
    import { Renderer } from '../src/renderer.js';
    import { CelestialBody } from '../src/celestial.js';
    import { Bullet } from '../src/bullet.js';
    import { GameController, GameState } from '../src/game-controller.js';
    import { Camera } from '../src/camera.js';

    const canvas = document.getElementById('c');
    canvas.width = 1200;
    canvas.height = 800;

    const G_PHYS = 300;
    const BULLET_R = 6;

    // =====================
    // 星体
    // =====================

    // 中心恒星（固定）
    const star = new CelestialBody({
      mass: 8000, orbit: CelestialBody.fixedPosition(600, 400),
      radius: 50, collisionRadius: 45, color: '#ffbb33', label: '恒星',
    });

    // 行星 A — 子弹绕它转
    const planetA = new CelestialBody({
      mass: 800, orbit: CelestialBody.circularOrbit(600, 400, 200, 10, 0),
      radius: 28, collisionRadius: 25, color: '#44ccbb', label: '水蓝星',
    });

    // 行星 B — 远处目标
    const planetB = new CelestialBody({
      mass: 500, orbit: CelestialBody.ellipticalOrbit(600, 400, 350, 280, 18, Math.PI/2),
      radius: 22, collisionRadius: 20, color: '#ff6688', label: '赤红星',
    });

    const allBodies = [star, planetA, planetB];

    // =====================
    // 物理引擎（带轨道函数，用于轨迹预测）
    // =====================
    const phys = new PhysicsEngine({ G: G_PHYS });
    let physicsTime = 0;
    for (const b of allBodies) {
      const p = b.getPosition();
      phys.addGravitySource(p.x, p.y, b.mass, b.collisionRadius, b.orbitFn);
    }

    // =====================
    // 子弹 — 绕行星 A 轨道，3 发不同相位（同轨道分散分布）
    // =====================
    const bullets = [
      new Bullet({ payloadMass: 5, fuelMass: 30, ve: 300, ignitionCount: 2, explosionRadius: 70, explosionImpulse: 4000 }),
      new Bullet({ payloadMass: 8, fuelMass: 20, ve: 250, ignitionCount: 3, explosionRadius: 50, explosionImpulse: 3000 }),
      new Bullet({ payloadMass: 3, fuelMass: 40, ve: 350, ignitionCount: 1, explosionRadius: 90, explosionImpulse: 6000 }),
    ];
    // 同轨道、不同相位（120° 间隔）
    for (let i = 0; i < bullets.length; i++) {
      bullets[i].bindOrbit(planetA, 50, planetA.radius, (i * 2 * Math.PI) / 3, G_PHYS);
    }

    // =====================
    // 控制器 + 镜头
    // =====================
    const ctrl = new GameController(canvas, { physics: phys, bullets, camera: null, getTime: () => physicsTime });
    const camera = new Camera(canvas, {
      shouldBlockPan: () => ctrl.getHoveredBullet() !== null,
    });
    ctrl.camera = camera;
    // 镜头对准恒星
    camera.x = 600; camera.y = 400; camera.zoom = 0.85;

    const r = new Renderer(canvas);
    const ctx = r.ctx;

    // =====================
    // 轨迹 + 爆炸
    // =====================
    const trail = [];
    const explosions = []; // { x, y, r, maxR, t }

    // =====================
    // HUD
    // =====================
    function hud() {
      const h = document.getElementById('hud');
      const st = ctrl.state;
      let s = '';
      if (st === GameState.PLAYING) s = '▶ 运行中';
      else if (st === GameState.AIMING) s = '⏸ 瞄准中 — 拖拽发射';
      // 显示悬停子弹信息
      const hb = ctrl.getHoveredBullet();
      const info = hb ? ` | 悬停: 点火${hb.remainingIgnitions}/${hb.ignitionCount} ΔV${hb.remainingDeltaV.toFixed(0)} 质量${hb.totalMass.toFixed(1)}` : '';
      const alive = bullets.filter(b => b.alive).length;
      h.innerHTML = `${s} | 存活:${alive}/${bullets.length}${info}`;
    }

    // =====================
    // 主循环
    // =====================
    function loop() {
      hud();

      // --- 更新星体位置到物理引擎 ---
      for (let i = 0; i < allBodies.length; i++) {
        const b = allBodies[i];
        if (!ctrl.shouldPause()) b.update(1 / 60);
        const p = b.getPosition();
        phys.updateSourcePosition(i, p.x, p.y);
      }

      // --- 物理步进 ---
      if (!ctrl.shouldPause()) {
        physicsTime += 1 / 60;
        for (const b of bullets) {
          if (!b.alive) continue;
          if (!b.launched) {
            b.updateOrbitPosition(1 / 60);
          } else {
            phys.stepParticle(b);
            trail.push({ x: b.x, y: b.y });
          }
          // 碰撞检测
          const col = phys.checkSourceCollision(b.x, b.y, BULLET_R);
          if (col) {
            explosions.push({
              x: b.x, y: b.y, r: 0,
              maxR: b.getEffectiveExplosionRadius() || 50,
            });
            b.alive = false;
          }
        }
      }

      // --- 更新爆炸动画 ---
      for (const ex of explosions) {
        ex.r += 4;
      }

      // =====================
      // 渲染
      // =====================
      r.clear();
      camera.applyTransform(ctx);

      // 星体
      for (const b of allBodies) r.drawCelestialBody(b);

      // 子弹轨道虚线圆（绕行星A）
      {
        const pa = planetA.getPosition();
        const orbR = planetA.radius + 50;
        ctx.strokeStyle = 'rgba(120, 200, 255, 0.22)';
        ctx.lineWidth = 1; ctx.setLineDash([2, 6]);
        ctx.beginPath(); ctx.arc(pa.x, pa.y, orbR, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
      }

      // 飞行轨迹
      if (trail.length > 1) r.drawTrail(trail, 'rgba(255, 160, 80, 0.55)');

      // 预测轨迹
      const pred = ctrl.getPredictedPath();
      if (pred.length > 0) r.drawPredictionPath(pred, 'rgba(255, 230, 60, 0.7)');

      // 预测碰撞点 + 虚线行星轮廓（只在拖拽瞄准时显示）
      const predCol = ctrl.getPredictedCollision();
      if (predCol && predCol.sourceIndex < allBodies.length) {
        const colBody = allBodies[predCol.sourceIndex];
        // 用碰撞时刻的行星轨道位置
        const cp = colBody.orbitFn(predCol.time);
        // 橙色碰撞点
        ctx.fillStyle = '#ff6633';
        ctx.beginPath(); ctx.arc(predCol.x, predCol.y, 6, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#ff6633'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(predCol.x, predCol.y, 10, 0, Math.PI * 2); ctx.stroke();
        // 碰撞时刻行星虚线轮廓（用行星自身颜色）
        ctx.strokeStyle = colBody.color; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
        ctx.beginPath();
        ctx.arc(cp.x, cp.y, colBody.collisionRadius, 0, Math.PI * 2);
        ctx.stroke(); ctx.setLineDash([]);
      }

      // 拖拽箭头
      const dv = ctrl.getDragVector();
      if (dv) {
        ctx.strokeStyle = '#ffe044'; ctx.lineWidth = 2.5;
        ctx.setLineDash([5, 3]);
        ctx.beginPath(); ctx.moveTo(dv.startX, dv.startY); ctx.lineTo(dv.endX, dv.endY);
        ctx.stroke(); ctx.setLineDash([]);
        const ang = Math.atan2(dv.endY - dv.startY, dv.endX - dv.startX);
        ctx.fillStyle = '#ffe044';
        ctx.beginPath();
        ctx.moveTo(dv.endX, dv.endY);
        ctx.lineTo(dv.endX - 12 * Math.cos(ang - 0.5), dv.endY - 12 * Math.sin(ang - 0.5));
        ctx.lineTo(dv.endX - 12 * Math.cos(ang + 0.5), dv.endY - 12 * Math.sin(ang + 0.5));
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#ffe044'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(dv.startX, dv.startY, 5, 0, Math.PI * 2); ctx.stroke();
      }

      // 子弹
      const hoveredBullet = ctrl.getHoveredBullet();
      for (const b of bullets) {
        if (!b.alive || !isFinite(b.x) || !isFinite(b.y)) continue;
        const hov = b === hoveredBullet;
        if (hov) {
          ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(b.x, b.y, BULLET_R + 7, 0, Math.PI * 2); ctx.stroke();
        }
        const col = b.launched ? '#ff7744' : '#44ccff';
        const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, BULLET_R);
        g.addColorStop(0, '#fff');
        g.addColorStop(0.4, col);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(b.x, b.y, BULLET_R, 0, Math.PI * 2); ctx.fill();
        // 方向线
        const sp = Math.sqrt(b.vx ** 2 + b.vy ** 2);
        if (sp > 1) {
          ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(b.x, b.y);
          ctx.lineTo(b.x + b.vx / sp * 12, b.y + b.vy / sp * 12);
          ctx.stroke();
        }
      }

      // 爆炸效果
      for (let i = explosions.length - 1; i >= 0; i--) {
        const ex = explosions[i];
        const alpha = 1 - ex.r / ex.maxR;
        if (alpha <= 0) { explosions.splice(i, 1); continue; }
        ctx.strokeStyle = `rgba(255, 180, 60, ${alpha})`;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = `rgba(255, 200, 80, ${alpha * 0.3})`;
        ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI * 2); ctx.fill();
      }

      camera.restoreTransform(ctx);

      // 屏幕空间 HUD
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.font = '11px monospace'; ctx.textAlign = 'left';
      ctx.fillText(`缩放:${camera.zoom.toFixed(1)}x | 镜头:(${camera.x.toFixed(0)},${camera.y.toFixed(0)}) | 滚轮缩放 | 空白处拖拽平移`, 10, 790);

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
